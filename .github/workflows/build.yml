name: Build

on:
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2022
            runtime: win-arm64
          # 独立编译 Windows 7/8/8.1 兼容包 (win7-x64)，通过 YY-Thunks 与 VC-LTL 兼容老系统，不影响常规 win-x64 包
          - name: Windows 7 x64
            os: windows-2022
            runtime: win-x64
            package: win7-x64
            publish-args: -p:Win7Compat=true
          # NativeAOT 在 Apple Silicon 上交叉编译 osx-x64，避免 Intel runner 排队
          - name: macOS (Intel)
            os: macos-latest
            runtime: osx-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
          - name: Linux
            os: ubuntu-latest
            runtime: linux-x64
            container: ubuntu:20.04
          # 在原生 arm64 runner 上使用 Ubuntu 20.04 容器编译，保持 glibc 2.31 低基线兼容性
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            runtime: linux-arm64
            container: ubuntu:20.04
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Install common CLI tools
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y sudo
          sudo apt-get install -y curl wget git unzip zip libicu66 tzdata clang lld zlib1g-dev libssl-dev
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: .nuget/packages
          key: nuget-${{ matrix.runtime }}-${{ hashFiles('src/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.runtime }}-

      - name: Publish
        run: |
          dotnet publish src/KeePassModern/KeePassModern.csproj -c Release -o publish -r ${{ matrix.runtime }} --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true ${{ matrix.publish-args }}

      # 将调试符号 (.dSYM, .dbg, .pdb) 从发布目录剥离并单独归档，不打入最终用户安装包
      - name: Split off debug symbols
        shell: bash
        run: |
          mkdir -p symbols
          find publish -maxdepth 1 \( -name '*.dSYM' -o -name '*.dbg' -o -name '*.pdb' \) -exec mv {} symbols/ \;
      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols.${{ matrix.package || matrix.runtime }}
          path: symbols/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "keepassmodern.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "keepassmodern.${{ matrix.runtime }}.tar" publish

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: keepassmodern.${{ matrix.package || matrix.runtime }}
          path: publish/*
          retention-days: 1
