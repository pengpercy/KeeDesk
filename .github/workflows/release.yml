name: Release Build (6-RID NativeAOT)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            platform: win
          - os: windows-2022
            rid: win-arm64
            platform: win
          - os: macos-15-intel
            rid: osx-x64
            platform: macos
          - os: macos-latest
            rid: osx-arm64
            platform: macos
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
          - os: ubuntu-latest
            rid: linux-arm64
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish NativeAOT (${{ matrix.rid }})
        run: dotnet publish src/KeePassModern/KeePassModern.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

      - name: Package macOS App Bundle & DMG (with zh-Hans.lproj)
        if: matrix.platform == 'macos'
        run: |
          chmod +x build/scripts/package-macos.sh
          bash build/scripts/package-macos.sh "publish/${{ matrix.rid }}" "dist/${{ matrix.rid }}" "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: KeePassModern-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}
            dist/${{ matrix.rid }}
