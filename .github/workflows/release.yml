name: Release Build (NativeAOT)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rids: win-x64
            platform: win
          # 单台 Apple Silicon runner 同时编译 osx-arm64 与 osx-x64，避免申请两台 macOS runner 排队与 10x 计费浪费
          - os: macos-15
            rids: osx-arm64 osx-x64
            platform: macos
          - os: ubuntu-24.04
            rids: linux-x64
            platform: linux
          - os: ubuntu-24.04-arm
            rids: linux-arm64
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux NativeAOT prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Read Version
        id: ver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish & Package macOS (osx-arm64 + osx-x64 on single runner)
        if: matrix.platform == 'macos'
        run: |
          chmod +x build/scripts/package-macos.sh
          for rid in ${{ matrix.rids }}; do
            dotnet publish src/KeePassModern/KeePassModern.csproj -c Release -r "$rid" --self-contained true -o "publish/$rid"
            bash build/scripts/package-macos.sh "publish/$rid" "dist" "$rid" "${{ steps.ver.outputs.version }}"
          done

      - name: Publish & Package Windows ZIP
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($rid in "${{ matrix.rids }}".Split(' ')) {
            dotnet publish src/KeePassModern/KeePassModern.csproj -c Release -r $rid --self-contained true -o "publish/$rid"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "dist/KeePassModern-${{ steps.ver.outputs.version }}-$rid.zip" -Force
          }

      - name: Publish & Package Linux tar.gz
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          for rid in ${{ matrix.rids }}; do
            dotnet publish src/KeePassModern/KeePassModern.csproj -c Release -r "$rid" --self-contained true -o "publish/$rid"
            tar -czf "dist/KeePassModern-${{ steps.ver.outputs.version }}-$rid.tar.gz" -C "publish/$rid" .
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.platform }}-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: ignore

  create-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" artifacts/* \
            --title "KeePassModern $TAG" \
            --generate-notes
