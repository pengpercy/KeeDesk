name: Release Build (NativeAOT)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            platform: win
          - os: macos-15-intel
            rid: osx-x64
            platform: macos
          - os: macos-15
            rid: osx-arm64
            platform: macos
          - os: ubuntu-24.04
            rid: linux-x64
            platform: linux
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux NativeAOT prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Read Version
        id: ver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Publish NativeAOT (${{ matrix.rid }})
        run: dotnet publish src/KeePassModern/KeePassModern.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

      - name: Package macOS App Bundle & DMG (with zh-Hans.lproj)
        if: matrix.platform == 'macos'
        run: |
          chmod +x build/scripts/package-macos.sh
          bash build/scripts/package-macos.sh "publish/${{ matrix.rid }}" "dist" "${{ matrix.rid }}" "${{ steps.ver.outputs.version }}"

      - name: Package Windows ZIP
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/KeePassModern-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip" -Force

      - name: Package Linux tar.gz
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/KeePassModern-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*

  create-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" artifacts/* \
            --title "KeePassModern $TAG" \
            --generate-notes
